services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: chatapp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PYTHON_API_URL=http://python-ai:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=fileapa
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/accident_db
      - JWT_SECRET=changeme-replace-with-long-random-string
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      python-ai:
        condition: service_started
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  python-ai:
    build: ../chatapi.python
    container_name: chatapp-python-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../chatapi.python/.env.local
      - .env
    environment:
      - MINIO_ENDPOINT=minio
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - OBSIDIAN_VAULT_PATH=/obsidian_vault/musya knowlads
      - PDF_BUCKET=pdf-library
    volumes:
      - ../obsidian_vault:/obsidian_vault
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: accident_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../chatapi.python/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accident_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: chatapp-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
